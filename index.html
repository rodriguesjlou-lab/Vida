<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Meu Planner</title>
<meta name="description" content="Organize sua rotina, hábitos, autocuidado, diário e finanças em um só lugar." />

<!-- PWA: manifest e cor de tema -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#F3C6D3" />

<!-- Ícones -->
<link rel="icon" type="image/png" href="icons/favicon.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

<!-- iOS: permitir instalação na tela inicial em modo "standalone" -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Meu Planner" />

<!-- Android/Chrome -->
<meta name="mobile-web-app-capable" content="yes" />

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #FFF6F8;
    overscroll-behavior-y: none;
    -webkit-text-size-adjust: 100%;
  }
  * {
    -webkit-tap-highlight-color: transparent;
    box-sizing: border-box;
  }
  #root {
    min-height: 100vh;
    min-height: 100dvh;
  }
  /* Tela de carregamento simples enquanto os módulos são baixados/compilados */
  #carregando {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: linear-gradient(160deg, #FDE6EC, #CBB4E055);
    font-family: 'Segoe UI', sans-serif;
    z-index: 9999;
  }
  #carregando .flor {
    font-size: 40px;
    animation: pulsar 1.4s ease-in-out infinite;
  }
  #carregando p {
    color: #5B4B57;
    font-size: 13px;
    margin: 0;
  }
  @keyframes pulsar {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.15); opacity: 0.7; }
  }
</style>

<!-- Import map: carrega React, ReactDOM, Recharts e lucide-react via ESM,
     sem necessidade de build/bundler local -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom"
  }
}
</script>
</head>
<body>
<div id="carregando">
  <div class="flor">🌸</div>
  <p>Carregando o seu planner...</p>
</div>
<div id="root"></div>

<!-- Babel Standalone: transpila o JSX de app.jsx diretamente no navegador -->
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<script type="text/babel" data-type="module" data-presets="react" src="app.jsx"></script>

<script>
  // Registra o service worker (necessário para instalação e funcionamento offline)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch((erro) => {
        console.warn("Falha ao registrar o service worker:", erro);
      });
    });
  }

  // Remove a tela de carregamento assim que o React montar algo em #root
  const observador = new MutationObserver(() => {
    const raiz = document.getElementById("root");
    const tela = document.getElementById("carregando");
    if (raiz && raiz.childElementCount > 0 && tela) {
      tela.style.display = "none";
      observador.disconnect();
    }
  });
  observador.observe(document.getElementById("root"), { childList: true, subtree: true });

  // Segurança: some com a tela de carregamento no máximo após alguns segundos
  setTimeout(() => {
    const tela = document.getElementById("carregando");
    if (tela) tela.style.display = "none";
  }, 8000);
</script>
</body>
</html>
